name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  conventions:
    name: Conventions and project rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rule guards on the tree
        run: pnpm agents:check
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: >-
          pnpm exec commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
      - name: Pull request title
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
      - name: Pull request text
        if: github.event_name == 'pull_request'
        env:
          PR_TEXT: |
            ${{ github.event.pull_request.title }}
            ${{ github.event.pull_request.body }}
        run: node scripts/agents-check.mjs --text-env PR_TEXT

  frontend:
    name: Frontend (lint, types, unit tests, bundle)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm size

  php:
    name: PHP (GLPI ${{ matrix.glpi }}, PHP ${{ matrix.php }}, ${{ matrix.db }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { glpi: 11.0.x, php: '8.2', db: 'mysql:8.0' }
          - { glpi: 11.0.x, php: '8.5', db: 'mariadb:10.6' }
          - { glpi: 12.0.x, php: '8.3', db: 'mysql:8.0' }
          - { glpi: 12.0.x, php: '8.5', db: 'mariadb:10.11' }
    container:
      image: ghcr.io/glpi-project/githubactions-glpi-apache:php-${{ matrix.php }}-glpi-${{ matrix.glpi }}
      # The checkout lands directly in GLPI's plugins directory.
      options: >-
        --volume ${{ github.workspace }}:/var/www/glpi/plugins:rw
        --user github-actions-runner
    services:
      db:
        image: ghcr.io/glpi-project/githubactions-${{ matrix.db }}
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
          MYSQL_DATABASE: glpi
        options: --shm-size=1g
    defaults:
      run:
        shell: sudo --set-home --user=www-data --preserve-env bash --noprofile --norc -eo pipefail {0}
        working-directory: /var/www/glpi/plugins/ticketboost
    steps:
      - uses: actions/checkout@v7
        with:
          path: ticketboost
          persist-credentials: false
      - name: Fix directory permissions
        shell: bash
        run: sudo setfacl --recursive --modify u:www-data:rwx /var/www/glpi/plugins
      - name: PHP gate (lint, static analysis, PHPUnit, coverage >= 85%)
        env:
          DB_HOST: db
          COVERAGE_MIN: '85'
        run: bash scripts/php-ci.sh

  e2e:
    name: E2E (Playwright on GLPI 11 and 12)
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get install -y gettext
      - run: pnpm install --frozen-lockfile
      - run: make build
      - name: Start GLPI 11 and 12
        run: make up COMPOSE="docker compose"
      - name: Install and activate the plugin
        run: ./scripts/glpi-plugin.sh "docker compose" glpi11 glpi12
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm e2e
      - name: GLPI logs on failure
        if: failure()
        run: docker compose logs glpi11 glpi12 | tail -n 300
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docs:
    name: Documentation build (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: pip install mkdocs-material==9.8.1
      - run: mkdocs build --strict

  workflows:
    name: Workflow lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" --workdir /repo rhysd/actionlint:1.7.12 -color

  package:
    name: Release archive dry run
    runs-on: ubuntu-latest
    needs: [frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: sudo apt-get install -y gettext
      - run: pnpm install --frozen-lockfile
      - run: make build
      - run: ./scripts/build-release.sh 0.0.0-ci
