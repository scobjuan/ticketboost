name: Bug report
description: Something does not work as documented.
labels: [bug]
body:
  - type: input
    id: versions
    attributes:
      label: Versions
      description: TicketBoost, GLPI and PHP versions, browser and OS.
      placeholder: TicketBoost 0.1.0, GLPI 11.0.12, PHP 8.3, Firefox 140 on Windows 11
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open ticket 42 as a technician
        2. Tap Ctrl
        3. Press A
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Browser console lines starting with [ticketboost] and GLPI php-errors.log entries.
      render: text
