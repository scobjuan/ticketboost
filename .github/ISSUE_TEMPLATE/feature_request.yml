name: Feature request
description: Propose a new shortcut or an improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What takes too many clicks or too much time today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: The action, the suggested key and who should be able to use it.
    validations:
      required: true
